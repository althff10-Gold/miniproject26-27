version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: teenpreneur-db
    environment:
      POSTGRES_DB: teenpreneur_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: teenpreneur-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: teenpreneur-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=teenpreneur_dev
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - postgres
      - ai-service
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: teenpreneur-web
    ports:
      - "80:80"
    depends_on:
      - api-server
    restart: unless-stopped

volumes:
  pgdata:
